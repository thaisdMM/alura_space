{% extends 'base/base.html' %}
{% load static %}

{% block title %}Autenticação{% endblock %}

{% block extra_css %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
{% endblock %}

{% block content %}
    <header class="cabecalho">

        <a href="{% url 'index' %}">
        <img src="{% static 'assets/logo/Logo(2).png' %}" alt="Logo da Alura Space">
        </a>

        {% include 'partials/_alertas.html' %}
    </header>

    <main class="container" style="max-width: 500px; margin-top: 50px;">
        {% block auth_content %}{% endblock %}
    </main>

    <footer class="rodape">
        <p class="rodape__texto">© 2026 Feito pela Thaís com carinho ❤️</p>
    </footer>
{% endblock %}
